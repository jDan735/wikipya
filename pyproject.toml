[project]
name = "wikipya"
version = "4.1.4"
description = "A simple async python library for search pages and images in wikis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Daniel Zakharov", email = "gzdan734@gmail.com" }
]
dependencies = [
    "aiohttp>=3.13.3",
    "beautifulsoup4>=4.14.2",
    "msgspec>=0.20.0",
    "pydantic>=2.12.5",
    "tghtml>=1.1.5",
]

[tool.pytest.ini_options]
addopts = "-p no:warnings"
norecursedirs = ".svn _build tmp*"
testpaths = "tests"
